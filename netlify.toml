# Offre gratuite : chaque déploiement en production coûte des crédits. La
# production ne se construit qu'au changement de version de package.json
# (voir backend/netlify/ignore-build.sh) ; les prévisualisations de PR, gratuites,
# se construisent toujours.
[build]
  ignore = "bash backend/netlify/ignore-build.sh"

# Version de Node figée (audit A-19), alignée sur la CI (.github/workflows/ci.yml)
# et sur .nvmrc. Le code des fonctions utilise AbortSignal.timeout (Node 17.3+) :
# sans cet épinglage, un changement de version par défaut chez Netlify pourrait
# casser la recherche d'aliments sans que la CI le voie.
[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "backend/netlify/functions"

[[redirects]]
  from = "/api/off/search"
  to = "/.netlify/functions/off-search"
  status = 200

[[redirects]]
  from = "/api/off/product"
  to = "/.netlify/functions/off-product"
  status = 200

# En-têtes de sécurité (audit A-07). Défense en profondeur : le jeton de session
# Supabase vit dans localStorage, une CSP limite donc fortement ce qu'une
# injection de script pourrait en faire.
#
# ⚠️ L'empreinte sha256 ci-dessous est celle du <script> en ligne de index.html
# (le thème appliqué avant l'affichage, pour éviter un flash clair en mode
# sombre). SI CE SCRIPT EST MODIFIÉ, il faut recalculer l'empreinte, sinon le
# navigateur le bloque et le flash revient :
#   python3 -c "import re,hashlib,base64;b=re.search(r'<script>(.*?)</script>',open('index.html').read(),re.S).group(1);print('sha256-'+base64.b64encode(hashlib.sha256(b.encode()).digest()).decode())"
# Le test e2e « en-têtes de sécurité » vérifie que l'empreinte correspond.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Le scanner de code-barres a besoin de la caméra ; rien d'autre.
    Permissions-Policy = "camera=(self), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'sha256-KBZ3SZLCRiaxvAre9Sxj299h4CiabYI1gfJ3eADdoTc='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://images.openfoodfacts.org https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"

# PWA : le service worker et le manifeste doivent toujours être revalidés,
# sinon une ancienne version du service worker resterait active.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"

# Fichiers générés par Vite : noms versionnés, donc immuables
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
