# Offre gratuite : chaque déploiement en production coûte des crédits. La
# production ne se construit qu'au changement de version de package.json
# (voir backend/netlify/ignore-build.sh) ; les prévisualisations de PR, gratuites,
# se construisent toujours.
[build]
  ignore = "bash backend/netlify/ignore-build.sh"

[functions]
  directory = "backend/netlify/functions"

[[redirects]]
  from = "/api/off/search"
  to = "/.netlify/functions/off-search"
  status = 200

[[redirects]]
  from = "/api/off/product"
  to = "/.netlify/functions/off-product"
  status = 200

# PWA : le service worker et le manifeste doivent toujours être revalidés,
# sinon une ancienne version du service worker resterait active.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"

# Fichiers générés par Vite : noms versionnés, donc immuables
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
