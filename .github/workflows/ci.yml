# Intégration continue : vérifie chaque push et chaque pull request
# (lint, types, tests, build de production) et rejoue les migrations de la
# base sur un Postgres vierge avant de lancer les tests SQL.
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, types, tests et build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Vérification des types
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build de production
        run: npm run build
        env:
          # Valeurs factices : le build n'appelle pas Supabase
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder-key

  database:
    name: Base de données (migrations et tests SQL)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Même version majeure de Postgres que la production Supabase
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - name: Rejouer les migrations et lancer les tests SQL
        run: bash scripts/test-db.sh
